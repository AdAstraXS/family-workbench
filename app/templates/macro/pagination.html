{% if page.has_other_pages %}<nav class="macro-page" aria-label="分页">
{% if page.has_previous %}<a href="{% if previous_url %}{{ previous_url }}{% else %}?page={{ page.previous_page_number }}{% endif %}">上一页</a>{% endif %}
<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>
{% if page.has_next %}<a href="{% if next_url %}{{ next_url }}{% else %}?page={{ page.next_page_number }}{% endif %}">下一页</a>{% endif %}
</nav>{% endif %}
