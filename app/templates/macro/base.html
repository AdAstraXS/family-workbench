{% extends "base.html" %}
{% block title %}宏观数据 · {{ site_household_name }}{% endblock %}
{% block extra_head %}
<style>
.macro-nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.macro-nav a[aria-current]{font-weight:700;border-bottom:2px solid #286557}.macro-meta{color:#5b6872;line-height:1.8}.macro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.macro-card{background:#fff;border:1px solid #dbe3e4;border-radius:12px;padding:18px}.macro-card h2{font-size:1.05rem;margin:8px 0}.macro-value{font-size:1.6rem;font-variant-numeric:tabular-nums}.macro-table{overflow-x:auto;background:#fff;border:1px solid #dbe3e4;border-radius:10px;margin:18px 0}.macro-table table{min-width:660px;width:100%;border-collapse:collapse}.macro-table th,.macro-table td{padding:12px;text-align:left;border-bottom:1px solid #e8eded}.macro-notice{padding:14px;background:#edf3f2;border-radius:8px;margin:16px 0}.macro-source{overflow-wrap:anywhere}.macro-card small{color:#52616b}.macro-page{display:flex;gap:18px;margin:20px 0}@media(max-width:600px){.macro-grid{grid-template-columns:1fr}.macro-card{padding:14px}.macro-value{font-size:1.4rem}}
</style>
{% endblock %}
