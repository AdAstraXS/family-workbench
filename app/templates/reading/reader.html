{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ book.title }} · 阅读</title><link rel="stylesheet" href="{% static 'reading/reader.css' %}"></head><body>
<header class="reader-top"><a href="{% url 'reading:detail' book.pk %}">← 返回</a><h1>{{ book.title }}</h1><button id="toggle-toc" aria-expanded="false" aria-controls="toc">目录</button><button id="toggle-settings" aria-expanded="false" aria-controls="reader-settings">设置</button><span id="reader-status" role="status" aria-live="polite">正在读取图书…</span></header>
<section id="reader-settings" hidden aria-label="阅读设置"><div id="font-control"><label>字号 <select id="font-size"><option value="14">更小号</option><option value="16">小号</option><option value="18" selected>标准</option><option value="21">较大</option><option value="24">大字</option></select></label><label>字间距 <select id="letter-spacing"><option value="compact">紧凑</option><option value="standard">标准</option><option value="loose" selected>宽松</option></select></label></div><div id="pdf-zoom-control" hidden><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button><select id="pdf-zoom" aria-label="缩放方式"><option value="width">适合宽度</option><option value="height">适合高度</option><option value="actual">100%</option><option value="custom" hidden>自定义</option></select></div><a id="summarize-current" href="{% url 'reading:ai_create' book.pk %}">总结当前章节</a><span id="chapter-label"></span><button id="save-now">保存位置</button></section>
<section id="conflict" hidden><strong>另一个页面已更新阅读位置。</strong><p>选择继续的位置后，才会恢复自动保存。</p><button id="use-server">跳到已保存位置</button><button id="use-local">使用当前阅读位置</button></section>
<div class="reader-layout"><aside id="toc" hidden aria-label="图书目录"></aside><main id="reading-surface" aria-label="阅读正文"></main></div>
<footer class="reader-toolbar"><button id="prev" aria-label="上一页">‹</button><span id="page-label">正在打开</span><button id="next" aria-label="下一页">›</button><form id="page-jump" hidden><input id="page-number" aria-label="页码" type="number" min="1" value="1"><button>跳转</button></form><button id="toggle-notes">批注</button></footer>
<div id="selection-actions" hidden role="toolbar" aria-label="选中文字操作"><button id="highlight-selection">划线</button><button id="comment-selection">批注</button><span id="selection-status" role="status"></span></div>
<aside id="selection-note" hidden><strong>添加批注</strong><p id="selected-text"></p><form id="annotation-form"><label>我的批注<textarea id="annotation-note" maxlength="10000" rows="3"></textarea></label><label>可见范围 <select id="annotation-visibility"><option value="private">仅自己</option><option value="family">分享给能阅读本书的家庭成员</option></select></label><button id="save-annotation">保存批注</button></form><p id="annotation-status" role="status"></p><button id="close-selection">收起</button></aside>
<aside id="notes-panel" hidden><h2>我的与已分享批注</h2><button id="refresh-notes">刷新批注</button><div id="notes-list"></div></aside>
<form hidden id="csrf-form">{% csrf_token %}</form>{{ reader_config|json_script:"reader-config" }}<script type="module" src="{% static 'reading/reader.js' %}"></script></body></html>
