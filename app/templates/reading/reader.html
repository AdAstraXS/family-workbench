{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ book.title }} · 阅读</title><link rel="stylesheet" href="{% static 'reading/reader.css' %}"></head><body>
<header class="reader-top"><a href="{% url 'reading:detail' book.pk %}">← 返回图书</a><h1>{{ book.title }}</h1><button id="toggle-toc" aria-expanded="false" aria-controls="toc">目录</button></header>
<div class="reader-toolbar"><button id="prev">上一页</button><span id="page-label">正在打开</span><button id="next">下一页</button><label id="font-control">字号 <select id="font-size"><option value="18">标准</option><option value="21">较大</option><option value="24">大字</option></select></label><form id="page-jump" hidden><label>页码 <input id="page-number" type="number" min="1" value="1"></label><button>跳转</button></form><label id="pdf-zoom-control" hidden>缩放 <select id="pdf-zoom"><option value="1">适合宽度</option><option value="1.5">150%</option><option value="2">200%</option></select></label><a id="summarize-current" href="{% url 'reading:ai_create' book.pk %}">总结当前章节</a><button id="save-now">保存位置</button></div>
<p id="reader-status" role="status" aria-live="polite">正在读取图书…</p>
<section id="conflict" hidden><strong>另一个页面已更新阅读位置。</strong><p>选择继续的位置后，才会恢复自动保存。</p><button id="use-server">跳到已保存位置</button><button id="use-local">使用当前阅读位置</button></section>
<div class="reader-layout"><aside id="toc" hidden aria-label="图书目录"></aside><main id="reading-surface" aria-label="阅读正文"></main></div>
<aside id="selection-note" hidden><strong>划线与批注</strong><p id="selected-text"></p><form id="annotation-form"><label>我的批注（可留空）<textarea id="annotation-note" maxlength="10000" rows="3"></textarea></label><label>可见范围 <select id="annotation-visibility"><option value="private">仅自己</option><option value="family">分享给能阅读本书的家庭成员</option></select></label><button id="save-annotation">保存划线与批注</button></form><p id="annotation-status" role="status"></p><button id="close-selection">收起</button></aside>
<button id="toggle-notes" class="notes-toggle">批注</button><aside id="notes-panel" hidden><h2>我的与已分享批注</h2><button id="refresh-notes">刷新批注</button><div id="notes-list"></div></aside>
<form hidden id="csrf-form">{% csrf_token %}</form>{{ reader_config|json_script:"reader-config" }}<script type="module" src="{% static 'reading/reader.js' %}"></script></body></html>
