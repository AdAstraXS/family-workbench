{% if items.has_other_pages %}<nav class="iw-actions" aria-label="分页">{% if items.previous_cursor %}<a href="?{{ filter_query }}&amp;cursor={{ items.previous_cursor|urlencode }}">上一页</a>{% endif %}<span>第 {{ items.number }} / {{ items.paginator.num_pages }} 页</span>{% if items.next_cursor %}<a href="?{{ filter_query }}&amp;cursor={{ items.next_cursor|urlencode }}">下一页</a>{% endif %}</nav>{% endif %}
