{% if research_nav.area == 'follow' and request.resolver_match.url_name != 'follow' %}<div class="rn-follow-state"><span>观察状态：{% if dossier.is_watched %}已加入观察{% else %}未加入观察{% endif %}</span>{% if research_can_write %}<form method="post" action="{% url 'investment_research:observation' dossier.pk %}">{% csrf_token %}<input type="hidden" name="enabled" value="{% if dossier.is_watched %}0{% else %}1{% endif %}"><input type="hidden" name="return_to" value="{{ request.get_full_path }}"><button type="submit">{% if dossier.is_watched %}停止观察{% else %}加入观察{% endif %}</button></form>{% endif %}<a href="{% url 'investment_research:next_day_tracking' dossier.pk %}?tab=settings">次日跟踪设置</a><small>观察状态用于公司列表筛选；AI 自动对照由次日跟踪设置单独管理。</small></div>{% endif %}
