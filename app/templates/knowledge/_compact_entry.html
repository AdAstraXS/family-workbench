<article class="knowledge-compact-entry">
  <div class="knowledge-compact-entry-meta">
    <span>{{ entry.source_name }}</span>
    <span>{% if entry.visibility == "family" %}家庭可见{% else %}仅自己{% endif %}</span>
    {% if entry.content_time %}<time>{{ entry.content_time|date:"m-d" }}</time>{% endif %}
  </div>
  <h3><a href="{{ entry.target_url }}">{{ entry.title }}</a></h3>
  {% if entry.hit_snippet %}<p>{{ entry.hit_snippet|truncatechars:110 }}</p>{% endif %}
</article>
